name: SOA CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------- SETUP ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---------- FRONTEND ----------
      - name: Install frontend deps
        working-directory: FrontEnd/SOA_frontend
        run: npm ci

      - name: Test frontend
        working-directory: FrontEnd/SOA_frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: FrontEnd/SOA_frontend
        run: npm run build

      # ---------- BACKEND ----------  
      - name: Install backend deps
        working-directory: restaurantService
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Test backend
        working-directory: restaurantService
        run: pytest

  docker:
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DCKR_PAT }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/rirs-frontend:latest ./FrontEnd/SOA_frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/rirs-frontend:latest

      - name: Build and push backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/rirs-backend:latest ./restaurantService
          docker push ${{ secrets.DOCKER_USERNAME }}/rirs-backend:latest