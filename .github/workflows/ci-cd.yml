name: SOA CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------- SETUP ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---------- CACHE ----------
      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: FrontEnd/SOA_frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('FrontEnd/SOA_frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('restaurantService/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ---------- FRONTEND ----------
      - name: Install frontend deps
        working-directory: FrontEnd/SOA_frontend
        run: npm ci

      - name: Lint frontend
        working-directory: FrontEnd/SOA_frontend
        run: npm run lint

      - name: Test frontend
        working-directory: FrontEnd/SOA_frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: FrontEnd/SOA_frontend
        run: npm run build

      # ---------- BACKEND ----------
      - name: Install backend deps
        working-directory: restaurantService
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Test backend
        working-directory: restaurantService
        run: pytest --cov=restaurant_service --cov-report=xml --cov-report=term

      # ---------- UPLOAD COVERAGE ----------
      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./FrontEnd/SOA_frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
        continue-on-error: true

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./restaurantService/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

      # ---------- ARTIFACTS ----------
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: FrontEnd/SOA_frontend/dist

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DCKR_PAT }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./FrontEnd/SOA_frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/rirs-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./restaurantService
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/rirs-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_URL }}"