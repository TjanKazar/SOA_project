name: SOA CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- SETUP ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # CACHING NODE MODULES
      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: FrontEnd/SOA_frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('FrontEnd/SOA_frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CACHING PYTHON PACKAGES
      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('restaurantService/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ---------- FRONTEND ----------
      - name: Install frontend dependencies
        working-directory: FrontEnd/SOA_frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: FrontEnd/SOA_frontend
        run: npm test -- --coverage --run

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: FrontEnd/SOA_frontend/coverage
          retention-days: 7

      - name: Build frontend (create dist)
        working-directory: FrontEnd/SOA_frontend
        run: npm run build

      # ARTIFACT: SAVE FRONTEND BUILD
      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: FrontEnd/SOA_frontend/dist
          retention-days: 7

      # ---------- BACKEND ----------
      - name: Install backend dependencies
        working-directory: restaurantService
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run backend tests with coverage
        working-directory: restaurantService
        run: pytest --cov=. --cov-report=html --cov-report=xml --cov-report=term

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: restaurantService/htmlcov
          retention-days: 7

      # ARTIFACT: SAVE BACKEND BUILD (Source)
      - name: Upload backend source artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-source
          path: restaurantService
          retention-days: 7

  docker:
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Docker Buildx to allow advanced features like caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DCKR_PAT }}

      # BACKEND DOCKER BUILD
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./restaurantService
          file: ./restaurantService/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/rirs-backend:latest
          # Docker Layer Caching
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/rirs-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/rirs-backend:buildcache,mode=max

      # FRONTEND DOCKER BUILD
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./FrontEnd/SOA_frontend
          file: ./FrontEnd/SOA_frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/rirs-frontend:latest
          # IMPORTANT: Pass the Render Backend URL to Vite during build
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          # Docker Layer Caching
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/rirs-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/rirs-frontend:buildcache,mode=max

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Render Deployment (Backend)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_BACKEND }}
        run: |
          curl -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
          -H "Authorization: Bearer ${RENDER_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": false}'

      - name: Trigger Render Deployment (Frontend)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_FRONTEND }}
        run: |
          curl -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
          -H "Authorization: Bearer ${RENDER_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": false}'